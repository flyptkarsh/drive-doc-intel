# Render Blueprint: Postgres + the Next.js web service.
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and ANTHROPIC_API_KEY are set by hand
# (sync: false). Then add the service URL to the Google OAuth client's
# Authorized JavaScript origins.
databases:
  - name: drive-doc-intel-db
    plan: basic-256mb
    databaseName: drive_doc_intel
    user: drive_doc_intel

services:
  - type: web
    name: drive-doc-intel
    runtime: node
    plan: starter # stays awake so the Drive poller keeps running
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drive-doc-intel-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_SIGNINS
        sync: false
